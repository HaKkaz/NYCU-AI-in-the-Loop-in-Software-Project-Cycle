x-database: &database
  environment:
    DATABASE_URL: ${DATABASE_URL:-sqlite:///./data/app.db}
  volumes:
    - ./backend/data:/srv/backend/data

services:
  migrate:
    <<: *database
    build:
      context: ./backend
      target: migrate
    restart: "no"

  api:
    <<: *database
    build:
      context: ./backend
      target: api
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
